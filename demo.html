<style>
/* 물품이음 시안 v2: 겉은 사진 먼저(1번), 일은 보드(2번), 말은 다정하게(3번).
   위 머리줄 메뉴 + 넓은 본문. 색은 검정 글자 + 브랜드 초록 + 주의 주황빨강 하나 */
:root{
  --k:#111a16;--k2:#36423c;--m:#68726d;--f:#9aa29e;--l:#ebeeec;--ls:#d9dfdb;--c:#f5f6f5;--w:#fff;
  --a:#0f7a5f;--a2:#0a5e49;--as:#e3f2ec;--al:#b9e0d1;
  --hot:#ff5a36;--hot-s:#fff0eb;
  --mine:#d97706;--mine-s:#fff6e8;
  --stop:#c2341f;--stop-s:#fdecea;
  --blue:#2d5d8a;--blue-s:#e8f0f8;
  --t1:#e9efe9;--t2:#e7ecf3;--t3:#f1ece4;--t4:#eceaf3;--t5:#e5f0ee;--t6:#f3ebe8;
  --mint:#e3f6ee;--sky:#e9f4ff;--peach:#ffece2;--sun:#ffcf4d;
  --board:#f6f7f9;
  --font:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --r:14px;--r2:20px;
  color-scheme:light
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--w);color:var(--k);font:15px/1.6 var(--font);word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--al);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* 머리줄 */
.shell{min-height:100vh;display:flex;flex-direction:column}
.hd{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--l);padding-top:env(safe-area-inset-top,0px)}
.hd-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:20px;padding:12px max(24px,env(safe-area-inset-right,0px)) 12px max(24px,env(safe-area-inset-left,0px))}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:21px;letter-spacing:-.04em;white-space:nowrap}
.logo img{width:32px;height:32px;border-radius:9px}
.logo.big{font-size:24px}.logo.big img{width:40px;height:40px;border-radius:11px}
.hd-nav{display:flex;gap:4px}
.hd-nav a{padding:8px 14px;border-radius:999px;font-weight:700;color:var(--k2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.hd-nav a:hover{background:var(--c)}
.hd-nav a.on{background:var(--k);color:#fff}
.ct{background:var(--hot);color:#fff;font-size:11px;font-weight:800;border-radius:999px;min-width:19px;line-height:19px;padding:0 5px;text-align:center}
.hd .sp{flex:1}
.todo-pill{background:var(--hot);color:#fff;font-weight:800;font-size:13px;border-radius:999px;padding:6px 12px;white-space:nowrap}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:999px;border:1px solid var(--l);background:var(--w);flex:0 0 auto}
.who{display:flex;flex-direction:column;font-size:13px;font-weight:700;line-height:1.25;white-space:nowrap}
.who small{font-weight:500;color:var(--m);font-size:11.5px}
.demo{max-width:1280px;margin:0 auto;width:100%;font-size:12.5px;color:#6b5a2a;padding:6px max(24px,env(safe-area-inset-right,0px)) 0 max(24px,env(safe-area-inset-left,0px))}
.demo b{background:#f5ead0;border-radius:5px;padding:1px 6px;margin-right:6px;font-size:11.5px}
.page{max-width:1280px;width:100%;margin:0 auto;padding:22px max(24px,env(safe-area-inset-right,0px)) 72px max(24px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:20px;flex:1}
.is-board .page{background:var(--board);max-width:none;padding-inline:max(24px,calc((100% - 1232px)/2))}
.tabbar{display:none}

/* 공통 */
.h1{font-size:30px;font-weight:900;letter-spacing:-.04em}
.sub{color:var(--m);font-size:14px}
.mut{color:var(--m)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card{background:var(--w);border:1px solid var(--l);border-radius:var(--r);padding:18px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;border:1px solid var(--ls);background:var(--w);color:var(--k);white-space:nowrap;min-height:40px}
.btn:hover{background:var(--c)}
.btn.pri{background:var(--a);border-color:var(--a);color:#fff}.btn.pri:hover{background:var(--a2)}
.btn.ink{background:var(--k);border-color:var(--k);color:#fff}.btn.ink:hover{background:#2a3530}
.btn.white{background:#fff;border-color:#fff}
.btn.warn{background:var(--stop-s);border-color:#f2c8c1;color:var(--stop)}
.btn.lg{padding:12px 20px;font-size:15px;border-radius:16px}
.btn.sm{padding:5px 12px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.label{font-size:12px;font-weight:800;color:var(--m);letter-spacing:.02em}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:800;padding:3px 10px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill svg.i{width:13px;height:13px}.pill:has(svg)::before{display:none}
.p-gray{background:#eef0ef;color:#4a5550}.p-amber{background:var(--mine-s);color:#9a5205}.p-green{background:var(--as);color:#0a5c47}.p-blue{background:var(--blue-s);color:var(--blue)}.p-deep{background:var(--a);color:#fff}.p-red{background:var(--stop-s);color:var(--stop)}.p-mute{background:#f1f1ef;color:#6b6f6c}
.notice{border-radius:var(--r);padding:12px 16px;font-size:14px;background:var(--as);color:#164d3e}
.notice.amber{background:var(--mine-s);color:#7a4605}
.notice.red{background:var(--stop-s);color:var(--stop)}
.ill{display:grid;place-items:center;background:var(--t1)}
.ill>svg{width:60%;height:60%}
.empty{text-align:center;padding:40px 16px;color:var(--m)}
.empty b{display:block;color:var(--k);font-size:16px;margin-bottom:4px}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;border:1px solid var(--ls);border-radius:12px;padding:10px 13px;background:var(--w);min-height:44px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px var(--as)}
textarea{min-height:84px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>span{font-size:13px;font-weight:800;color:var(--k2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--l);font-size:14px}
.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;accent-color:var(--a);margin-top:2px}

/* 진행 표시 */
.stepper{display:flex;align-items:flex-start}
.stepper .s{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0;position:relative;font-size:12px;color:var(--m);text-align:center}
.stepper .s i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ls);background:var(--w);z-index:1}
.stepper .s.d i{background:var(--a);border-color:var(--a)}
.stepper .s.c i{border-color:var(--a);box-shadow:0 0 0 4px var(--as)}
.stepper .s.c{color:var(--a);font-weight:800}
.stepper .s.x i{border-color:var(--stop);background:var(--stop-s);box-shadow:0 0 0 4px var(--stop-s)}
.stepper .s.x{color:var(--stop);font-weight:800}
.stepper .s+.s::before{content:"";position:absolute;top:8px;right:50%;width:100%;height:2px;background:#e3e8e5}
.stepper .s.d+.s::before{background:var(--a)}
.mini{display:flex;gap:3px;margin-top:6px;max-width:220px}
.mini i{height:4px;flex:1;border-radius:2px;background:#e3e8e5}
.mini i.d{background:var(--a)}.mini i.c{background:var(--al)}.mini i.x{background:var(--stop)}

/* 홈: 인사 + 말풍선 + 사진 모자이크 */
.hello{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:center;background:var(--mint);border-radius:28px;padding:28px 32px}
.hello .hi{font-size:14px;font-weight:700;color:#3d6b5b;margin-bottom:6px}
.hello h1{font-size:clamp(26px,3vw,34px);font-weight:900;letter-spacing:-.04em}
.hello h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--sun) 62%)}
.hello p{margin:10px 0 18px;color:#3d4a44;font-size:15.5px;max-width:52ch}
.hello-art{height:150px;border-radius:24px;background:#fff;display:grid;place-items:center}
.hello-art svg{width:62%;height:62%}
.bubbles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.bubble{border-radius:24px;padding:18px 22px;display:flex;flex-direction:column;gap:3px;min-width:0}
.bubble:hover{filter:brightness(.98)}
.bubble small{font-weight:800;color:var(--m);font-size:12.5px}
.bubble b{font-size:19px;font-weight:800;letter-spacing:-.02em}
.bubble span{font-size:13.5px;color:var(--m)}
.bubble.peach{background:var(--peach)}.bubble.sky{background:var(--sky)}.bubble.gray{background:var(--c)}
.feed-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-top:8px}
.feed-head h2{font-size:24px;font-weight:900;letter-spacing:-.04em}
.feed-head p{font-size:14px}
.mosaic{display:grid;grid-template-columns:1.3fr 1fr 1fr 1fr;grid-auto-rows:170px;gap:12px}
.mosaic .tile-wrap.big{grid-row:span 2}
.tile-wrap{position:relative;min-width:0}
.tile{position:relative;display:grid;place-items:center;height:100%;border-radius:20px;overflow:hidden;background:var(--t1);transition:transform .15s}
.tile:hover{transform:translateY(-2px)}
.tile>svg{width:60%;height:60%}
.tile.c1{background:var(--t1)}.tile.c2{background:var(--t2)}.tile.c3{background:var(--t3)}.tile.c4{background:var(--t4)}.tile.c5{background:var(--t5)}
.tile .km{position:absolute;left:12px;top:11px;background:#fff;border-radius:999px;font-size:12px;font-weight:900;padding:2px 10px;color:var(--a)}
.tile .cap{position:absolute;left:12px;right:12px;bottom:11px;display:flex;justify-content:space-between;align-items:flex-end;gap:6px}
.tile .cap b{font-size:15px;font-weight:800;line-height:1.3;background:rgba(255,255,255,.94);border-radius:9px;padding:3px 9px;min-width:0}
.tile-wrap.big .cap b{font-size:20px}
.tile .q{background:var(--k);color:#fff;border-radius:999px;font-size:12.5px;font-weight:900;padding:3px 11px;white-space:nowrap}
.heart{position:absolute;right:10px;top:9px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.94);display:grid;place-items:center;color:var(--m);z-index:2}
.heart.on{color:var(--hot)}.heart.on svg{fill:currentColor}

/* 물품 찾기 */
.market-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.market-head .h1{flex:0 0 auto}
.search{position:relative;flex:1;min-width:260px}
.search input{padding-left:46px;min-height:52px;font-size:15.5px;border-radius:999px;background:var(--c);border-color:var(--c)}
.search input:focus{background:#fff}
.search svg{position:absolute;left:17px;top:17px;color:var(--m)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:0;background:var(--c);border-radius:999px;padding:8px 15px;font-size:14px;color:var(--k2);font-weight:700;white-space:nowrap}
.chip:hover{background:#eceeed}
.chip.on{background:var(--k);color:#fff}
.chip.line{background:#fff;border:1px solid var(--ls);padding:7px 14px}
.chip.line.on{background:var(--k);border-color:var(--k)}
.chip[disabled]{opacity:.4}
.sort{width:auto;border-radius:999px;font-weight:700}
.grid-feed{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px 14px}
.item .tile-wrap{aspect-ratio:4/5}
.item-meta{display:flex;flex-direction:column;gap:3px;padding:8px 4px 0;font-size:12.5px;color:var(--m)}
.item-meta .ok{display:inline-flex;align-items:center;gap:4px;color:var(--a);font-weight:800}
.item-meta .ok svg{width:14px;height:14px}
.item-meta .conds{display:flex;gap:4px;flex-wrap:wrap}
.item-meta .conds i{font-style:normal;background:var(--c);border-radius:6px;padding:0 7px;color:var(--k2);font-size:12px}

/* 보드 */
.board-bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.board-bar .sp{flex:1}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:#e1e5ea;border:1px solid #e1e5ea;border-radius:12px;overflow:hidden}
.kpi div{background:#fff;padding:12px 18px}
.kpi span{display:block;font-size:12.5px;color:var(--m)}
.kpi b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.kpi b.hot{color:var(--mine)}.kpi b.red{color:var(--stop)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;align-items:start}
.col h2{font-size:13px;font-weight:800;color:var(--m);display:flex;justify-content:space-between;margin:0 2px 8px}
.col h2 em{font-style:normal;background:#e6e9ee;border-radius:5px;padding:0 7px;color:var(--k)}
.col-empty{font-size:12.5px;color:var(--f);border:1px dashed #d8dde3;border-radius:10px;padding:14px;text-align:center}
.bcard{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;background:#fff;border:1px solid #e1e5ea;border-radius:10px;padding:10px 11px;margin-bottom:8px;transition:box-shadow .15s}
.bcard:hover{box-shadow:0 4px 14px rgba(20,30,40,.08)}
.bcard .th{width:40px;height:40px;border-radius:8px;background:#eef1f4;display:grid;place-items:center}
.bcard .th svg{width:78%;height:78%}
.bcard b{display:block;font-size:13.5px;line-height:1.35}
.bcard .tx span{font-size:12px;color:var(--m)}
.bcard .turn{grid-column:1/-1;font-size:12px;font-weight:800;color:#9a5205}
.bcard .turn.them{color:var(--m);font-weight:600}
.bcard.me{border-left:4px solid var(--mine);background:#fffdf8}
.bcard.soft{border-left:4px solid var(--ls)}
.bcard.soft .turn{color:var(--m)}
.bcard.stop{border-left:4px solid var(--stop);background:#fff8f7}.bcard.stop .turn{color:var(--stop)}
.bcard.faded{opacity:.6}
.board-m{display:none}

/* 물품 상세·주고받기 */
.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:24px;align-items:start}
.detail .photo{aspect-ratio:4/3;border-radius:24px;position:relative;overflow:hidden}
.side-panel{position:sticky;top:84px;display:flex;flex-direction:column;gap:12px}
.avail{font-size:13px;color:var(--m)}
.avail b{display:block;font-size:38px;color:var(--k);line-height:1.15;font-weight:900}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.seg button{border:2px solid var(--l);border-radius:14px;padding:10px 12px;background:var(--w);text-align:left}
.seg button.on{border-color:var(--k);background:var(--c)}
.seg button b{display:block;font-size:15px}
.seg button span{font-size:12.5px;color:var(--m)}
.seg button:disabled{opacity:.4}
.stepperq{display:flex;align-items:center;border:1px solid var(--ls);border-radius:999px;overflow:hidden;background:var(--w)}
.stepperq button{border:0;background:var(--c);width:42px;height:42px;font-size:18px}
.stepperq input{border:0;text-align:center;width:60px;min-height:42px;box-shadow:none!important}
.ship{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;background:var(--c);border-radius:12px;padding:10px 13px}
.spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:0}
.spec div{min-width:0}.spec dt{font-size:12px;color:var(--m);font-weight:700}.spec dd{margin:0;font-weight:700}
.sticky-cta{display:none}
.parties{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.parties .p small{display:block;font-size:12px;color:var(--m);font-weight:800}
.parties .p b{font-size:18px;font-weight:800}
.parties .arrow{font-size:22px;color:var(--a)}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.list .li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--l)}
.list .li:first-child{border-top:0}
.list .li b{display:block;font-weight:700}
.list .li span.s{font-size:12.5px;color:var(--m)}
.tl .ev{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;padding:9px 0;position:relative}
.tl .ev::before{content:"";position:absolute;left:9px;top:26px;bottom:-8px;width:2px;background:#e3e8e5}
.tl .ev:last-child::before{display:none}
.tl .ev i{width:20px;height:20px;border-radius:50%;background:var(--a);border:4px solid var(--as);box-sizing:border-box;margin-top:2px}
.tl .ev.now i{background:var(--w);border:2px solid var(--a);box-shadow:0 0 0 4px var(--as)}
.tl .ev.x i{background:var(--stop);border-color:var(--stop-s)}
.tl .ev b{display:block;font-size:14px}
.tl .ev span{font-size:12.5px;color:var(--m)}
.help{background:var(--mint);border-radius:var(--r2);padding:16px 18px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.help ol{margin:0;padding-left:18px;color:var(--k2);display:grid;gap:3px}
.help b{font-size:14px}

    { t: '내 차례 처리하기', d: '한결도서관이 우리 마이크 1개를 신청했어요. 「1개 예비 배정」을 눌러 보세요. 진행 막대와 기록이 함께 바뀌어요.', go: function () { go('#/deal/T2'); } },
    { t: '물품 찾기', d: '사진이 먼저 보여요. 거리와 남은 수량이 사진 위에, 증빙 확인과 상태별 수량은 아래에 있어요. 「가까운 순」과 「양호만」을 눌러 보세요.', go: function () { go('#/market'); } },
    { t: '물건 받기 신청', d: '상태를 큰 버튼으로 고르고 수량을 정하면 예상 배송비가 바로 나와요. 「받기 신청」을 누르면 보드에 한 건이 생겨요.', go: function () { go('#/lot/L1'); } },
    { t: '물건 올리기', d: '사진·에듀파인 엑셀·대장, 어느 입구로 들어와도 같은 다섯 단계예요. AI 제안은 「넣기」를 눌러야 들어가요. 끝까지 가서 「검토 요청」을 눌러 보세요.', go: function () { ui.draft = null; ui.step = 0; go('#/new'); } },
    { t: '검토자가 게시하기', d: '업무 검토자 박검토 선생님으로 바꿨어요. 홈의 「검토하기」를 눌러 확인 3가지를 체크하고 게시해요. 작성자는 스스로 게시할 수 없어요.', go: function () { S.me = 'u2'; save(); go('#/home'); } },
    { t: '우리 기관 보드', d: '우리 기관 물건과 주고받기를 단계별 칸에 한눈에 펼쳐요. 내 차례인 카드는 주황 띠로 보여요. 「내 차례만」을 누르면 할 일만 남아요.', go: function () { S.me = 'u1'; save(); ui.boardF = 'all'; ui.boardCol = 'me'; go('#/board'); } }
  ];
  function tourPanel() {
    var T = ui.tour, st = TOUR[T.i];
    if (!T.open) return '<button class="tour-fab" data-act="tour-toggle">시연 안내 열기</button>';
    return '<aside class="tour" aria-label="시연 안내"><div class="between"><span class="label">시연 안내 · ' + (T.i + 1) + ' / ' + TOUR.length + '</span><button class="iconbtn" style="width:30px;height:30px" data-act="tour-toggle" aria-label="시연 안내 접기">' + icon('x') + '</button></div>' +
      '<div class="tour-dots">' + TOUR.map(function (x, i) { return '<button data-act="tour-go" data-i="' + i + '" class="' + (i === T.i ? 'on' : i < T.i ? 'd' : '') + '" aria-label="' + (i + 1) + '단계 ' + x.t + '"></button>'; }).join('') + '</div>' +
      '<b>' + esc(st.t) + '</b><p>' + esc(st.d) + '</p>' +
      '<div class="row"><button class="btn sm" data-act="tour-prev"' + (T.i ? '' : ' disabled') + '>이전</button>' +
      (T.i === 0 && !S.me ? '<button class="btn sm pri" data-act="tour-go" data-i="0">시연 시작</button>' : T.i < TOUR.length - 1 ? '<button class="btn sm pri" data-act="tour-next">다음: ' + esc(TOUR[T.i + 1].t) + '</button>' : '<button class="btn sm pri" data-act="tour-go" data-i="0">처음부터</button>') + '</div></aside>';
  }

  // ── 그리기 ──
  function render() {
    var parts = location.hash.replace(/^#\/?/, '').split('/'), r = parts[0] || 'home', id = parts[1];
    var app = $('#app');
    if (!S.me || !me()) { app.innerHTML = vLogin() + tourPanel(); document.title = '물품이음 시안'; return; }
    var html, opts = {};
    if (r === 'lot') { var v = vLot(id); html = v.html || v; if (v.sticky) { opts.sticky = true; opts.stickyHtml = v.sticky; } }
    else html = r === 'market' ? vMarket() : r === 'board' || r === 'mine' || r === 'deals' ? (r = 'board', vBoard()) : r === 'deal' ? vDeal(id) : r === 'new' ? vNew() : r === 'more' ? vMore() : (r = 'home', vHome());
    var focusId = document.activeElement && document.activeElement.id;
    app.innerHTML = shell(r, html, opts) + tourPanel();
    document.title = (CRUMB[r] || '물품이음') + ' · 물품이음 시안';
    var q = focusId === 'q' && $('#q');
    if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  window.addEventListener('hashchange', function () { ui.help = false; render(); window.scrollTo(0, 0); });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { ui.q = e.target.value; render(); }
    if (e.target.id === 'qty') { var h = location.hash.split('/')[2]; ui.qty[h] = Math.max(1, +e.target.value || 1); }
    if (e.target.classList.contains('wq')) { readWizard(); var s = $('#qsum'); if (s) s.textContent = sumQ(ui.draft); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'sort') { ui.sort = e.target.value; render(); }
    if (e.target.id === 'qty') render();
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.dataset.act, id = b.dataset.id, u = S.me && me();
    function ev(t, what, note) { t.events.push({ t: now(), who: org(myOrg()).short + ' ' + u.name, what: what, note: note }); }
    switch (a) {
      case 'login': S.me = id; save(); toast(me().name + ' 선생님으로 들어왔어요'); go('#/home'); render(); break;
      case 'logout': S.me = null; save(); go('#/home'); render(); break;
      case 'reset': var who = S.me; S = fresh(); S.me = who; save(); ui.draft = null; ui.step = 0; toast('시연 데이터를 처음으로 되돌렸어요'); render(); break;
      case 'help': e.preventDefault(); ui.help = !ui.help; render(); break;
      case 'tour-toggle': ui.tour.open = !ui.tour.open; render(); break;
      case 'tour-go': ui.tour.i = +b.dataset.i; TOUR[ui.tour.i].go(); render(); window.scrollTo(0, 0); break;
      case 'tour-next': ui.tour.i = Math.min(TOUR.length - 1, ui.tour.i + 1); TOUR[ui.tour.i].go(); render(); window.scrollTo(0, 0); break;
      case 'tour-prev': ui.tour.i = Math.max(0, ui.tour.i - 1); TOUR[ui.tour.i].go(); render(); window.scrollTo(0, 0); break;
      case 'cat': ui.cat = b.dataset.v; render(); break;
      case 'toggle': ui[b.dataset.k] = !ui[b.dataset.k]; render(); break;
      case 'fav': e.preventDefault(); var i = S.fav.indexOf(id); if (i >= 0) S.fav.splice(i, 1); else S.fav.push(id); save(); toast(i >= 0 ? '관심물품에서 뺐어요' : '관심물품에 담았어요'); render(); break;
      case 'cond': ui.cond[id] = +b.dataset.i; ui.qty[id] = 1; render(); break;
      case 'qty': var l0 = lot(id), gs = l0.groups.filter(function (g) { return !/비공개/.test(g.cond); }), gi = ui.cond[id] != null ? ui.cond[id] : Math.max(0, gs.findIndex(function (g) { return g.avail > 0; })); ui.qty[id] = Math.min(gs[gi].avail, Math.max(1, (ui.qty[id] || 1) + (+b.dataset.d))); render(); break;
      case 'request':
        var L = lot(id), G = L.groups.filter(function (g) { return !/비공개/.test(g.cond); }), gi2 = ui.cond[id] != null ? ui.cond[id] : Math.max(0, G.findIndex(function (g) { return g.avail > 0; })), g = G[gi2], n = Math.min(ui.qty[id] || 1, g.avail);
        if (!g || !g.avail) { toast('신청할 수 있는 수량이 없습니다'); break; }
        var purpose = ($('#purpose') || {}).value || '교실 사용', date = ($('#pdate') || {}).value || '협의';
        g.avail -= n; var T = { id: 'T' + (++S.seq), lot: id, from: L.org, to: myOrg(), cond: g.cond, qty: n, purpose: purpose, date: date, state: 'REQUESTED', events: [] };
        ev(T, '신청 · ' + g.cond + ' ' + n + '개', purpose); S.transfers.unshift(T); save(); toast(n + '개 받기 신청을 보냈어요'); go('#/deal/' + T.id); break;
      case 'reserve': var t1 = deal(id); t1.state = 'RESERVED'; ev(t1, '예비 배정 · ' + t1.qty + '개'); save(); toast('예비 배정했어요. 다음은 인계 기록이에요'); render(); break;
      case 'decline': var t2 = deal(id); t2.state = 'DECLINED'; restore(t2); ev(t2, '선정하지 않음'); save(); toast('선정하지 않았어요. 수량은 되돌려 놓았어요'); render(); break;
      case 'cancel': var t3 = deal(id); t3.state = 'CANCELLED'; restore(t3); ev(t3, '신청 취소'); save(); toast('신청을 취소했어요'); render(); break;
      case 'send': if (!$('#photo-ok').checked) { toast('인계 사진 첨부를 확인해 주세요'); break; } var t4 = deal(id); t4.state = 'SENT'; ev(t4, '인계 기록 · ' + t4.qty + '개 · 사진 1장'); save(); toast('인계를 기록했어요. 이제 상대 기관이 받은 수량을 확인할 차례예요'); render(); break;
      case 'receive': var t5 = deal(id), got = Math.max(0, +$('#rq').value || 0); if (got === t5.qty) { t5.state = 'RECEIVED'; ev(t5, '인수 확인 · ' + got + '개'); toast('받은 수량을 확인했어요'); } else { t5.state = 'DISPUTED'; ev(t5, '수량 불일치 · 보냄 ' + t5.qty + ' / 받음 ' + got); toast('수량이 달라서 잠시 멈췄어요'); } save(); render(); break;
      case 'resolve': var t6 = deal(id); t6.state = 'RECEIVED'; ev(t6, '실제 전량 수령 확인'); save(); toast('정상 인수로 바꿨어요'); render(); break;
      case 'done': if (!$('#ledger-ok').checked) { toast('에듀파인 처리 여부를 확인해 주세요'); break; } var t7 = deal(id); t7.state = 'DONE'; ev(t7, '대장 반영 확인'); save(); toast('끝까지 마쳤어요. 수고하셨어요'); render(); break;
      case 'submit-review': lot(id).state = 'REVIEW'; save(); toast('검토를 요청했어요'); render(); break;
      case 'approve': if ($$('.rv').some(function (c) { return !c.checked; })) { toast('확인 항목 3가지를 모두 체크해 주세요'); break; } var L2 = lot(id); L2.state = 'PUBLISHED'; L2.verified = true; L2.days = 0; save(); toast('게시했어요. 이제 다른 학교에서 찾을 수 있어요'); render(); break;
      case 'reject': lot(id).state = 'DRAFT'; save(); toast('작성자에게 수정을 요청했어요'); render(); break;
      case 'pause': lot(id).state = 'PAUSED'; save(); toast('게시를 멈췄어요'); render(); break;
      case 'resume': lot(id).state = 'PUBLISHED'; save(); toast('다시 게시했어요'); render(); break;
      case 'bf': ui.boardF = b.dataset.v; render(); break;
      case 'bcol': ui.boardCol = b.dataset.v; render(); break;
      case 'entry-ledger': ui.draft = newDraft('ledger'); ui.step = 0; break;
      case 'entry': readWizard(); ui.draft.entry = b.dataset.v; render(); break;
      case 'pick': ui.draft.ill = b.dataset.v; render(); break;
      case 'ai': readWizard(); ui.draft.title = '교실 빔프로젝터'; ui.draft.model = 'EB-X41'; ui.draft.cat = 'ELECTRONICS'; toast('AI 제안을 넣었어요. 맞는지 한 번 봐 주세요'); render(); break;
      case 'wstep': readWizard(); draftFromLedger(ui.draft); ui.step = +b.dataset.i; render(); break;
      case 'wnext': readWizard(); if (ui.step === 0 && ui.draft.entry !== 'photo' && !ui.draft.ledger.length) { toast('가져올 행을 하나 이상 골라 주세요'); break; } draftFromLedger(ui.draft); ui.step = Math.min(4, ui.step + 1); render(); window.scrollTo(0, 0); break;
      case 'wprev': readWizard(); ui.step = Math.max(0, ui.step - 1); render(); break;
      case 'save-draft': case 'finish':
        var d = ui.draft, groups = Object.keys(d.q).filter(function (k) { return d.q[k] > 0; }).map(function (k) { return { cond: k, qty: +d.q[k], avail: +d.q[k] }; });
        var nl = { id: 'L' + (++S.seq), title: d.title || '이름 없는 물품', cat: d.cat, org: myOrg(), ill: d.ill, state: a === 'finish' ? 'REVIEW' : 'DRAFT', days: 0, verified: false, maker: d.maker, model: d.model, desc: d.desc || '설명 없음', groups: groups.length ? groups : [{ cond: '양호', qty: 1, avail: 1 }], by: u.id };
        S.lots.unshift(nl); save(); ui.draft = null; ui.step = 0; ui.mineTab = nl.state; toast(a === 'finish' ? '검토를 요청했어요' : '초안으로 저장했어요'); go('#/lot/' + nl.id); break;
    }
  });
  function restore(t) { var l = lot(t.lot); l.groups.forEach(function (g) { if (g.cond === t.cond) g.avail += t.qty; }); }

  render();
})();

</script>
