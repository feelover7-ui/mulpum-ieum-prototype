<style>
/* 물품이음 시안: 데스크톱은 왼쪽 메뉴 5개, 휴대폰은 아래 탭 5개. 색은 브랜드 초록 1개 + 상태색 */
:root{
  --a:#147d64;--a2:#0c604d;--as:#e6f3ee;--al:#bfe0d3;
  --k:#1f3229;--k2:#3d5147;--m:#5d6c64;--f:#8a978f;--l:#e1e8e3;--ls:#cfd9d2;--c:#f6f8f7;--w:#fff;
  --amber:#c27a0e;--amber-s:#fbf0dc;--amber-k:#8a5106;--blue:#2d5d8a;--blue-s:#e6eef7;--blue-k:#24527d;--red:#a8382a;--red-s:#fbe9e6;--red-k:#a1321f;
  --font:'Pretendard Variable',Pretendard,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --r:12px;--sh:0 1px 2px rgba(20,48,36,.06);--sh2:0 8px 24px rgba(20,48,36,.10);
  color-scheme:light
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--c);color:var(--k);font:15px/1.6 var(--font);word-break:keep-all;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--al);outline-offset:2px}
h1,h2,h3,h4{margin:0;line-height:1.35;text-wrap:balance}
p{margin:0}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}

/* 틀 */
.app{min-height:100vh}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--w);border-right:1px solid var(--l);padding:22px 14px 16px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:19px;letter-spacing:-.02em;padding:0 6px 14px}
.brand img{width:34px;height:34px}
.brand small{display:block;font-size:11px;font-weight:500;color:var(--m);letter-spacing:0}
.cta{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--a);color:#fff;border-radius:10px;padding:11px;font-weight:700;margin:0 2px 12px}
.cta:hover{background:var(--a2)}
.nv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;color:var(--k2);font-weight:550}
.nv:hover{background:var(--c)}
.nv.on{background:var(--as);color:var(--a);font-weight:750}
.ct{margin-left:auto;background:var(--red);color:#fff;font-size:11px;font-weight:700;border-radius:999px;min-width:20px;padding:0 6px;line-height:20px;text-align:center}
.side .me{margin-top:auto;border-top:1px solid var(--l);padding:12px 8px 0;font-size:12px;color:var(--m);display:flex;flex-direction:column;gap:2px}
.side .me b{color:var(--k);font-size:13px}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:10px;padding:12px 28px;background:var(--w);border-bottom:1px solid var(--l);position:sticky;top:0;z-index:5}
.top .crumb{font-size:13px;color:var(--m)}
.top .sp{flex:1}
.mbrand{display:none;align-items:center;gap:7px;font-weight:800;font-size:17px}
.mbrand img{width:28px;height:28px}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:10px;border:1px solid var(--l);background:var(--w)}
.demo{background:#f5efdf;color:#5b4a1e;font-size:12.5px;padding:7px 28px;border-bottom:1px solid #ece2c6}
.demo b{background:#e9dcb5;border-radius:5px;padding:1px 6px;margin-right:6px;font-size:11.5px}
.page{padding:26px 28px 60px;max-width:1240px;width:100%;display:flex;flex-direction:column;gap:18px}
.tabbar{display:none}

/* 공통 부품 */
.h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.sub{color:var(--m);font-size:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card{background:var(--w);border:1px solid var(--l);border-radius:var(--r);padding:16px;box-shadow:var(--sh);min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:9px;padding:9px 14px;font-weight:650;font-size:14px;border:1px solid var(--ls);background:var(--w);color:var(--k2);white-space:nowrap;min-height:40px}
.btn:hover{background:var(--c)}
.btn.pri{background:var(--a);border-color:var(--a);color:#fff}
.btn.pri:hover{background:var(--a2)}
.btn.warn{background:var(--red-s);border-color:#efc9c1;color:var(--red-k)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.label{font-size:12px;font-weight:700;color:var(--m);letter-spacing:.01em}
.mut{color:var(--m)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap;vertical-align:middle}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill svg.i{width:13px;height:13px}
.pill:has(svg)::before{display:none}
.p-gray{background:#eef0ef;color:#4a5550}.p-amber{background:var(--amber-s);color:var(--amber-k)}.p-green{background:var(--as);color:#0b5c48}.p-blue{background:var(--blue-s);color:var(--blue-k)}.p-deep{background:var(--a);color:#fff}.p-red{background:var(--red-s);color:var(--red-k)}.p-mute{background:#f1f1ef;color:#6b6f6c}
.notice{border-radius:10px;padding:11px 14px;font-size:13.5px;background:var(--as);color:#1e4d3f}
.notice.amber{background:var(--amber-s);color:#6d4206}
.notice.red{background:var(--red-s);color:var(--red-k)}
.ill{display:grid;place-items:center;background:#eef2ee}
.ill>svg{width:60%;height:60%}
.empty{text-align:center;padding:36px 16px;color:var(--m)}
.empty b{display:block;color:var(--k);font-size:16px;margin-bottom:4px}
input[type=text],input[type=number],input[type=search],input[type=date],select,textarea{width:100%;border:1px solid var(--ls);border-radius:9px;padding:9px 12px;background:var(--w);min-height:42px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 3px var(--as)}
textarea{min-height:80px;resize:vertical}
.fld{display:flex;flex-direction:column;gap:5px}
.fld>span{font-size:13px;font-weight:700;color:var(--k2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--l);font-size:14px}
.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;accent-color:var(--a);margin-top:2px}

/* 진행 표시 */
.stepper{display:flex;align-items:flex-start}
.stepper .s{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0;position:relative;font-size:12px;color:var(--m);text-align:center}
.stepper .s i{width:18px;height:18px;border-radius:50%;border:2px solid var(--ls);background:var(--w);z-index:1}
.stepper .s.d i{background:var(--a);border-color:var(--a)}
.stepper .s.c i{border-color:var(--a);box-shadow:0 0 0 4px var(--as)}
.stepper .s.c{color:var(--a);font-weight:800}
.stepper .s.x i{border-color:var(--red);background:var(--red-s);box-shadow:0 0 0 4px var(--red-s)}
.stepper .s.x{color:var(--red-k);font-weight:800}
.stepper .s+.s::before{content:"";position:absolute;top:8px;right:50%;width:100%;height:2px;background:#dfe6e1}
.stepper .s.d+.s::before{background:var(--a)}
.mini{display:flex;gap:3px;margin-top:6px;max-width:220px}
.mini i{height:4px;flex:1;border-radius:2px;background:#dfe6e1}
.mini i.d{background:var(--a)}.mini i.c{background:var(--al)}.mini i.x{background:var(--red)}

/* 홈 */
.tasks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.task{border-left:5px solid var(--a);display:flex;flex-direction:column;gap:4px}
.task.amber{border-left-color:var(--amber)}.task.red{border-left-color:var(--red)}.task.blue{border-left-color:var(--blue)}
.task .n{font-size:30px;font-weight:800;line-height:1.1}
.task .n small{font-size:14px;font-weight:600;color:var(--m);margin-left:3px}
.task .who{font-size:13px;color:var(--k2);min-height:2.6em}
.task .btn{align-self:flex-start;margin-top:6px}
.two{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px}
.list .li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--l)}
.list .li:first-child{border-top:0}
.list .li .ill{width:52px;height:52px;border-radius:9px}
.list .li b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .li span.s{font-size:12.5px;color:var(--m)}
.list a.li:hover b{color:var(--a)}

/* 찾기 */
.search{position:relative}
.search input{padding-left:42px;min-height:50px;font-size:15px;border-radius:12px}
.search svg{position:absolute;left:14px;top:15px;color:var(--m)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{border:1px solid var(--ls);background:var(--w);border-radius:999px;padding:6px 13px;font-size:13.5px;color:var(--k2);font-weight:600;white-space:nowrap}
.chip:hover{border-color:var(--al);background:var(--as)}
.chip.on{background:var(--k);border-color:var(--k);color:#fff}
.chip[disabled]{opacity:.45}
.chip small{font-weight:500;opacity:.75;margin-left:3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.lot{background:var(--w);border:1px solid var(--l);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:box-shadow .2s,border-color .2s;position:relative}
.lot:hover{box-shadow:var(--sh2);border-color:var(--al)}
.lot .ph{aspect-ratio:4/3;position:relative}
.lot .q{position:absolute;left:10px;bottom:10px;background:var(--w);border-radius:7px;font-size:12px;font-weight:800;padding:2px 8px}
.lot .ver{position:absolute;left:10px;top:10px}
.heart{position:absolute;right:10px;top:10px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.92);display:grid;place-items:center;color:var(--m);z-index:2}
.heart.on{color:var(--red)}
.heart.on svg{fill:currentColor}
.lot .bd{padding:11px 13px 13px;display:flex;flex-direction:column;gap:5px}
.lot .bd .cat{font-size:12px;color:var(--m);font-weight:600}
.lot .bd b{font-size:15px;font-weight:700}
.conds{display:flex;gap:5px;flex-wrap:wrap}
.conds span{font-size:12px;background:var(--c);border:1px solid var(--l);border-radius:6px;padding:0 7px;color:var(--k2)}
.where{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--m);border-top:1px solid var(--l);padding-top:7px;margin-top:2px}
.where .d{color:var(--a);font-weight:800}

/* 상세 */
.detail{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:20px;align-items:start}
.detail .photo{aspect-ratio:4/3;border-radius:14px;position:relative;overflow:hidden}
.side-panel{position:sticky;top:76px;display:flex;flex-direction:column;gap:12px}
.avail{font-size:13px;color:var(--m)}
.avail b{display:block;font-size:34px;color:var(--a);line-height:1.15;font-weight:800}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.seg button{border:1.5px solid var(--l);border-radius:10px;padding:9px 11px;background:var(--w);text-align:left}
.seg button.on{border-color:var(--a);background:var(--as)}
.seg button b{display:block;font-size:14px}
.seg button span{font-size:12px;color:var(--m)}
.seg button:disabled{opacity:.45}
.stepperq{display:flex;align-items:center;border:1px solid var(--ls);border-radius:9px;overflow:hidden;background:var(--w)}
.stepperq button{border:0;background:var(--c);width:40px;height:40px;font-size:18px}
.stepperq input{border:0;text-align:center;width:60px;min-height:40px;box-shadow:none!important}
.ship{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;background:var(--c);border-radius:9px;padding:9px 12px}
.spec{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 18px;margin:0}
.spec div{min-width:0}
.spec dt{font-size:12px;color:var(--m);font-weight:600}
.spec dd{margin:0;font-weight:600}
.sticky-cta{display:none}

/* 우리 물품·주고받기 */
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--l);padding-bottom:0}
.tabs button{border:0;background:none;padding:9px 12px;font-weight:650;color:var(--m);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--a);border-bottom-color:var(--a)}
.tabs button small{font-weight:600;margin-left:3px}
.rowlist{display:flex;flex-direction:column}
.rowlist a{display:grid;grid-template-columns:60px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--l)}
.rowlist a:first-child{border-top:0}
.rowlist a:hover{background:#fafcfb}
.rowlist .ill{width:60px;height:60px;border-radius:10px}
.rowlist b{display:block;font-weight:700}
.rowlist .s{font-size:13px;color:var(--m)}
.rowlist .r{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.turn{font-size:12px;font-weight:700}
.turn.me{color:var(--red-k)}.turn.them{color:var(--m)}

.parties{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:12px;align-items:center}
.parties .p small{display:block;font-size:12px;color:var(--m);font-weight:700}
.parties .p b{font-size:17px}
.parties .arrow{font-size:22px;color:var(--a)}
.tl .ev{display:grid;grid-template-columns:20px minmax(0,1fr) auto;gap:12px;padding:9px 0;position:relative}
.tl .ev::before{content:"";position:absolute;left:9px;top:26px;bottom:-8px;width:2px;background:#dfe6e1}
.tl .ev:last-child::before{display:none}
.tl .ev i{width:20px;height:20px;border-radius:50%;background:var(--a);border:4px solid var(--as);box-sizing:border-box;margin-top:2px}
.tl .ev.now i{background:var(--w);border:2px solid var(--a);box-shadow:0 0 0 4px var(--as)}
.tl .ev.x i{background:var(--red);border-color:var(--red-s)}
.tl .ev b{display:block;font-size:14px}
.tl .ev span{font-size:12.5px;color:var(--m)}
.help{background:#f3f7f4;border:1px solid var(--l);border-radius:12px;padding:14px;font-size:13.5px;display:flex;flex-direction:column;gap:8px}
.help ol{margin:0;padding-left:18px;color:var(--k2);display:grid;gap:3px}
.help b{font-size:14px}
.ai{display:flex;gap:8px;align-items:center;background:#eef3fa;border:1px dashed #9db6d3;border-radius:9px;padding:8px 11px;font-size:13px;color:var(--blue-k)}
.ai .btn{margin-left:auto}

/* 올리기 */
.wiz{display:grid;grid-template-columns:200px minmax(0,1fr) 260px;gap:16px;align-items:start}
.steps{display:flex;flex-direction:column;gap:3px;position:sticky;top:76px}
.steps button{display:flex;gap:9px;align-items:center;padding:9px 10px;border-radius:9px;font-size:14px;color:var(--m);border:0;background:none;text-align:left}
.steps button b{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--ls);display:grid;place-items:center;font-size:12px;flex:0 0 24px}
.steps button.d{color:var(--k2)}.steps button.d b{background:var(--a);border-color:var(--a);color:#fff}
.steps button.c{background:var(--w);color:var(--a);font-weight:800;box-shadow:var(--sh)}.steps button.c b{border-color:var(--a)}
.entry{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.entry button{border:1.5px solid var(--l);border-radius:12px;padding:14px;background:var(--w);display:flex;flex-direction:column;gap:4px;text-align:left}
.entry button.on{border-color:var(--a);background:var(--as)}
.entry button b{font-size:15px}
.entry button span{font-size:12.5px;color:var(--m)}
.pickphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.pickphotos button{aspect-ratio:1;border-radius:10px;border:2px solid transparent;padding:0;overflow:hidden}
.pickphotos button.on{border-color:var(--a)}
.qtable{width:100%;border-collapse:collapse;font-size:14px}
.qtable th,.qtable td{padding:8px 6px;border-bottom:1px solid var(--l);text-align:left}
.qtable th{font-size:12px;color:var(--m)}
.qtable input{max-width:110px;text-align:right}
.ledger{width:100%;border-collapse:collapse;font-size:13px}
.ledger th,.ledger td{padding:7px 8px;border-bottom:1px solid var(--l);text-align:left;white-space:nowrap}
.ledger th{background:var(--c);font-size:12px;color:var(--m)}
.tscroll{overflow-x:auto}

/* 도움 칸 */
.drawer-bg{position:fixed;inset:0;background:rgba(20,30,25,.28);z-index:30}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(400px,100%);background:var(--w);z-index:31;box-shadow:-10px 0 30px rgba(0,0,0,.12);display:flex;flex-direction:column;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));gap:12px;overflow-y:auto}
.drawer details{border:1px solid var(--l);border-radius:10px;padding:10px 12px}
.drawer summary{font-weight:700;cursor:pointer}
.drawer details p{margin-top:6px;font-size:14px;color:var(--k2)}
.drawer .src{font-size:12px;color:var(--m);margin-top:6px}

/* 로그인 */
.login{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}
.login .l{background:#e9f3ee;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:30px}
.login .l h1{font-size:clamp(32px,4vw,50px);font-weight:800;letter-spacing:-.03em;line-height:1.25}
.login .l h1 em{font-style:normal;color:var(--a)}

  // ── 물품 상세 ──
  function shipCost(k, n) { var lo = Math.round((20000 + k * 4000 + n * 3000) / 10000), hi = Math.round((30000 + k * 6000 + n * 5000) / 10000); return '약 ' + lo + '만~' + hi + '만 원'; }

      '<section class="card">' + stepper(l.state) + '</section>' +

      '</div>';
    var right, sticky = '';
    if (!own && l.state === 'PUBLISHED') {
      right = '<aside class="side-panel"><section class="card" style="display:flex;flex-direction:column;gap:12px"><div class="avail">이어 받을 수 있는 수량<b>' + avail(l) + '<small style="font-size:15px">개</small></b></div>' +
        '<div class="fld"><span>상태 고르기</span><div class="seg">' + groups.map(function (x, i) { return '<button data-act="cond" data-id="' + id + '" data-i="' + i + '" class="' + (i === sel ? 'on' : '') + '"' + (x.avail ? '' : ' disabled') + '><b>' + x.cond + '</b><span>' + x.avail + '개 가능</span></button>'; }).join('') + '</div></div>' +
        '<div class="fld"><span>필요 수량</span><div class="stepperq" style="width:max-content"><button data-act="qty" data-id="' + id + '" data-d="-1" aria-label="하나 줄이기">−</button><input type="number" id="qty" value="' + n + '" min="1" max="' + max + '" aria-label="필요 수량"><button data-act="qty" data-id="' + id + '" data-d="1" aria-label="하나 늘리기">＋</button></div></div>' +

        '<button class="btn pri req-btn" data-act="request" data-id="' + id + '">' + n + '개 받기 신청</button></section></aside>';
      sticky = '<div class="sticky-cta"><span class="btn" style="flex:0 0 auto">' + (g ? g.cond.replace(' 있음', '') : '') + ' ' + n + '개</span><button class="btn pri" data-act="request" data-id="' + id + '">' + n + '개 받기 신청</button></div>';
    } else if (own) {
      var act = '';
      if (l.state === 'DRAFT') act = '<div class="notice amber">우리 기관만 보는 초안입니다. 불용 증빙을 붙이고 검토를 요청하세요.</div><button class="btn pri" data-act="submit-review" data-id="' + id + '">검토 요청</button>';

  }

  // ── 우리 물품 ──
  function vMine() {
    var tabs = [['DRAFT', '작성 중', ['DRAFT']], ['REVIEW', '검토 대기', ['REVIEW']], ['PUBLISHED', '나눔 중', ['PUBLISHED']], ['END', '끝남', ['PAUSED', 'CLOSED']]];
    var mine = S.lots.filter(function (l) { return l.org === myOrg(); });
    var cur = tabs.filter(function (t) { return t[0] === ui.mineTab; })[0] || tabs[0];
    var list = mine.filter(function (l) { return cur[2].indexOf(l.state) >= 0; });
    return '<div class="between"><div><h1 class="h1">우리 물품</h1><p class="sub">우리 기관이 내놓은 물품을 단계별로 봅니다.</p></div><a class="btn pri" href="#/new">' + icon('plus') + '물품 올리기</a></div>' +
      '<div class="tabs" role="tablist">' + tabs.map(function (t) { var n = mine.filter(function (l) { return t[2].indexOf(l.state) >= 0; }).length; return '<button role="tab" aria-selected="' + (t === cur) + '" class="' + (t === cur ? 'on' : '') + '" data-act="mtab" data-v="' + t[0] + '">' + t[1] + '<small>' + n + '</small></button>'; }).join('') + '</div>' +
      (list.length ? '<div class="card rowlist" style="padding:0">' + list.map(function (l) {
        var waiting = dealsOf(l).filter(function (t) { return t.state === 'REQUESTED'; }).length;
        return '<a href="#/lot/' + l.id + '"><div class="ill">' + ill(l.ill) + '</div><div><b>' + esc(l.title) + '</b><span class="s">' + l.groups.map(function (g) { return g.cond + ' ' + g.qty; }).join(' · ') + ' · ' + avail(l) + '개 남음</span>' + mini(l.state) + '</div><div class="r">' + pill(l.state) + (waiting ? '<span class="turn me">신청 ' + waiting + '건 · 선정 필요</span>' : '') + '</div></a>';
      }).join('') + '</div>' : '<div class="card empty"><b>' + cur[1] + ' 물품이 없어요</b>' + (cur[0] === 'DRAFT' ? '<a class="btn pri" href="#/new" style="margin-top:12px">물품 올리기</a>' : '') + '</div>') +
      '<div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap"><div style="flex:1;min-width:220px"><b>에듀파인 대장에서 고르기</b><p class="mut" style="font-size:13px">가져온 자산 행을 골라 바로 초안을 만듭니다. (예전 「대장 가져오기」 메뉴)</p></div><a class="btn" href="#/new" data-act="entry-ledger">대장에서 고르기</a></div>';
  }

  // ── 주고받기 ──
  function vDeals() {
    var all = myDeals(), mine = myOrg();
    var tabs = [['in', '받을 물건', function (t) { return t.to === mine && !end(t); }], ['out', '보낼 물건', function (t) { return t.from === mine && !end(t); }], ['end', '끝남', end]];
    function end(t) { return ['DONE', 'DECLINED', 'CANCELLED'].indexOf(t.state) >= 0; }
    var cur = tabs.filter(function (t) { return t[0] === ui.dealTab; })[0] || tabs[0];
    var list = all.filter(cur[2]);
    return '<div><h1 class="h1">주고받기</h1><p class="sub">신청부터 인계·인수·대장 반영까지. 내 차례인 건은 빨간 글자로 표시합니다.</p></div>' +
      '<div class="tabs" role="tablist">' + tabs.map(function (t) { var n = all.filter(t[2]).length, m = all.filter(t[2]).filter(myTurn).length; return '<button role="tab" aria-selected="' + (t === cur) + '" class="' + (t === cur ? 'on' : '') + '" data-act="dtab" data-v="' + t[0] + '">' + t[1] + '<small>' + n + '</small>' + (m ? ' <span class="ct" style="display:inline-block">' + m + '</span>' : '') + '</button>'; }).join('') + '</div>' +
      (list.length ? '<div class="card rowlist" style="padding:0">' + list.map(function (t) {

      }).join('') + '</div>' : '<div class="card empty"><b>' + cur[1] + '이 없어요</b>' + (cur[0] === 'in' ? '<a class="btn pri" href="#/market" style="margin-top:12px">물품 찾기</a>' : '') + '</div>');
  }
  function vDeal(id) {
    var t = deal(id); if (!t) return notFound();
    var l = lot(t.lot), mine = myOrg(), sender = t.from === mine, mt = myTurn(t);
    var next = { REQUESTED: '선정', RESERVED: '인계 기록', SENT: '인수 확인', RECEIVED: '대장 반영 확인', DISPUTED: '수량 불일치 해결' }[t.state];
    var act = '';

    else if (!sender && t.state === 'SENT') act = '<div class="fld"><span>실제로 받은 수량</span><input type="number" id="rq" value="' + t.qty + '" min="0" max="' + t.qty + '" style="max-width:140px"></div><button class="btn pri" data-act="receive" data-id="' + id + '">받은 수량 확인</button><p class="mut" style="font-size:12px">보낸 수량과 다르면 「수량 불일치」로 멈추고 양쪽이 확인합니다.</p>';
    else if (t.state === 'RECEIVED') act = '<label class="chk"><input type="checkbox" id="ledger-ok">에듀파인 관리전환(' + (sender ? '불용·반출' : '취득') + ') 처리를 마쳤습니다</label><button class="btn pri" data-act="done" data-id="' + id + '">대장 반영 확인</button>';
    else if (t.state === 'DISPUTED') act = '<div class="notice red">보낸 수량과 받은 수량이 다릅니다. 실물을 다시 세어 확인하세요.</div><button class="btn pri" data-act="resolve" data-id="' + id + '">실제 전량 수령 확인</button>';
    else if (!sender && t.state === 'REQUESTED') act = '<button class="btn warn" data-act="cancel" data-id="' + id + '">신청 취소</button>';
    var helpBox = sender
      ? '<div class="help"><b>보낸 다음 우리 기관이 할 일</b><ol><li>물품이음에서 인계 기록 (사진)</li><li>상대가 받은 수량 확인</li><li>에듀파인에서 관리전환 반출 처리</li><li>「대장 반영 확인」</li></ol></div>'
      : '<div class="help"><b>받은 다음 우리 기관이 할 일</b><ol><li>물품이음에서 받은 수량 확인</li><li>에듀파인에서 관리전환 취득 등록</li><li>「대장 반영 확인」</li></ol><span class="mut">메뉴 위치와 서식은 오른쪽 위 「?」 도움 칸에서 근거와 함께 확인하세요.</span></div>';
    var evs = t.events.map(function (e) { return '<div class="ev' + (/불일치/.test(e.what) ? ' x' : '') + '"><i></i><div><b>' + esc(e.what) + '</b><span>' + esc(e.who) + (e.note ? ' · "' + esc(e.note) + '"' : '') + '</span></div><span class="mut" style="font-size:12px">' + esc(e.t) + '</span></div>'; }).join('');
    if (next && t.state !== 'DONE') evs += '<div class="ev now"><i></i><div><b>' + next + ' 기다리는 중</b><span>' + (mt ? '우리 차례' : '상대 기관 차례') + '</span></div>' + (mt ? '<span class="pill p-red">내 차례</span>' : '<span class="pill p-amber">상대 차례</span>') + '</div>';
    return '<div><a class="mut row" href="#/deals" style="gap:4px;font-size:14px">' + icon('back') + '주고받기</a></div>' +
      '<div class="between"><div class="row"><h1 class="h1">' + esc(l.title) + ' ' + t.qty + '개</h1>' + pill(t.state) + '</div><a class="btn sm" href="#/lot/' + l.id + '">물품 보기</a></div>' +
      '<section class="card parties"><div class="p"><small>보내는 기관' + (sender ? ' (우리)' : '') + '</small><b>' + esc(org(t.from).name) + '</b></div><span class="arrow" aria-hidden="true">→</span><div class="p"><small>받는 기관' + (!sender ? ' (우리)' : '') + '</small><b>' + esc(org(t.to).name) + '</b><div class="mut" style="font-size:13px">' + t.cond + ' ' + t.qty + '개 · ' + esc(t.date) + '</div></div></section>' +
      '<section class="card">' + stepper(t.state) + '</section>' +
      '<div class="two"><section class="card"><h2 class="label" style="margin-bottom:6px">기록</h2><div class="tl">' + evs + '</div></section>' +
      '<div style="display:flex;flex-direction:column;gap:12px">' + (act ? '<section class="card" style="display:flex;flex-direction:column;gap:10px"><h2 class="label">' + (mt ? '내 차례: ' + mt : '할 수 있는 일') + '</h2>' + act + '</section>' : '') + helpBox + '</div></div>';
  }

      '<div class="tour-dots">' + TOUR.map(function (x, i) { return '<button data-act="tour-go" data-i="' + i + '" class="' + (i === T.i ? 'on' : i < T.i ? 'd' : '') + '" aria-label="' + (i + 1) + '단계 ' + x.t + '"></button>'; }).join('') + '</div>' +
      '<b>' + esc(st.t) + '</b><p>' + esc(st.d) + '</p>' +
      '<div class="row"><button class="btn sm" data-act="tour-prev"' + (T.i ? '' : ' disabled') + '>이전</button>' +
      (T.i === 0 && !S.me ? '<button class="btn sm pri" data-act="tour-go" data-i="0">시연 시작</button>' : T.i < TOUR.length - 1 ? '<button class="btn sm pri" data-act="tour-next">다음: ' + esc(TOUR[T.i + 1].t) + '</button>' : '<button class="btn sm pri" data-act="tour-go" data-i="0">처음부터</button>') + '</div></aside>';
  }

  // ── 그리기 ──
  function render() {
    var parts = location.hash.replace(/^#\/?/, '').split('/'), r = parts[0] || 'home', id = parts[1];
    var app = $('#app');
    if (!S.me || !me()) { app.innerHTML = vLogin() + tourPanel(); document.title = '물품이음 시안'; return; }
    var html, opts = {};
    if (r === 'lot') { var v = vLot(id); html = v.html || v; if (v.sticky) { opts.sticky = true; opts.stickyHtml = v.sticky; } }
    else html = r === 'market' ? vMarket() : r === 'mine' ? vMine() : r === 'deals' ? vDeals() : r === 'deal' ? vDeal(id) : r === 'new' ? vNew() : r === 'more' ? vMore() : (r = 'home', vHome());
    var focusId = document.activeElement && document.activeElement.id;
    app.innerHTML = shell(r, html, opts) + tourPanel();
    document.title = (CRUMB[r] || '물품이음') + ' · 물품이음 시안';
    var q = focusId === 'q' && $('#q');
    if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  }
  window.addEventListener('hashchange', function () { ui.help = false; render(); window.scrollTo(0, 0); });

  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { ui.q = e.target.value; render(); }
    if (e.target.id === 'qty') { var h = location.hash.split('/')[2]; ui.qty[h] = Math.max(1, +e.target.value || 1); }
    if (e.target.classList.contains('wq')) { readWizard(); var s = $('#qsum'); if (s) s.textContent = sumQ(ui.draft); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.id === 'sort') { ui.sort = e.target.value; render(); }
    if (e.target.id === 'qty') render();
  });
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var a = b.dataset.act, id = b.dataset.id, u = S.me && me();
    function ev(t, what, note) { t.events.push({ t: now(), who: org(myOrg()).short + ' ' + u.name, what: what, note: note }); }
    switch (a) {
      case 'login': S.me = id; save(); toast(me().name + ' 계정으로 들어왔습니다'); go('#/home'); render(); break;
      case 'logout': S.me = null; save(); go('#/home'); render(); break;
      case 'reset': var who = S.me; S = fresh(); S.me = who; save(); ui.draft = null; ui.step = 0; toast('시연 데이터를 처음으로 되돌렸습니다'); render(); break;
      case 'help': e.preventDefault(); ui.help = !ui.help; render(); break;
      case 'tour-toggle': ui.tour.open = !ui.tour.open; render(); break;
      case 'tour-go': ui.tour.i = +b.dataset.i; TOUR[ui.tour.i].go(); render(); window.scrollTo(0, 0); break;
      case 'tour-next': ui.tour.i = Math.min(TOUR.length - 1, ui.tour.i + 1); TOUR[ui.tour.i].go(); render(); window.scrollTo(0, 0); break;
      case 'tour-prev': ui.tour.i = Math.max(0, ui.tour.i - 1); TOUR[ui.tour.i].go(); render(); window.scrollTo(0, 0); break;
      case 'cat': ui.cat = b.dataset.v; render(); break;
      case 'toggle': ui[b.dataset.k] = !ui[b.dataset.k]; render(); break;
      case 'fav': e.preventDefault(); var i = S.fav.indexOf(id); if (i >= 0) S.fav.splice(i, 1); else S.fav.push(id); save(); toast(i >= 0 ? '관심물품에서 뺐습니다' : '관심물품에 담았습니다'); render(); break;
      case 'cond': ui.cond[id] = +b.dataset.i; ui.qty[id] = 1; render(); break;
      case 'qty': var l0 = lot(id), gs = l0.groups.filter(function (g) { return !/비공개/.test(g.cond); }), gi = ui.cond[id] != null ? ui.cond[id] : Math.max(0, gs.findIndex(function (g) { return g.avail > 0; })); ui.qty[id] = Math.min(gs[gi].avail, Math.max(1, (ui.qty[id] || 1) + (+b.dataset.d))); render(); break;
      case 'request':
        var L = lot(id), G = L.groups.filter(function (g) { return !/비공개/.test(g.cond); }), gi2 = ui.cond[id] != null ? ui.cond[id] : Math.max(0, G.findIndex(function (g) { return g.avail > 0; })), g = G[gi2], n = Math.min(ui.qty[id] || 1, g.avail);
        if (!g || !g.avail) { toast('신청할 수 있는 수량이 없습니다'); break; }
        var purpose = ($('#purpose') || {}).value || '교실 사용', date = ($('#pdate') || {}).value || '협의';
        g.avail -= n; var T = { id: 'T' + (++S.seq), lot: id, from: L.org, to: myOrg(), cond: g.cond, qty: n, purpose: purpose, date: date, state: 'REQUESTED', events: [] };
        ev(T, '신청 · ' + g.cond + ' ' + n + '개', purpose); S.transfers.unshift(T); save(); toast(n + '개 받기 신청을 보냈습니다'); go('#/deal/' + T.id); break;
      case 'reserve': var t1 = deal(id); t1.state = 'RESERVED'; ev(t1, '예비 배정 · ' + t1.qty + '개'); save(); toast('예비 배정했습니다. 다음은 인계 기록입니다'); render(); break;
      case 'decline': var t2 = deal(id); t2.state = 'DECLINED'; restore(t2); ev(t2, '선정하지 않음'); save(); toast('선정하지 않았습니다. 수량을 되돌렸습니다'); render(); break;
      case 'cancel': var t3 = deal(id); t3.state = 'CANCELLED'; restore(t3); ev(t3, '신청 취소'); save(); toast('신청을 취소했습니다'); render(); break;
      case 'send': if (!$('#photo-ok').checked) { toast('인계 사진 첨부를 확인해 주세요'); break; } var t4 = deal(id); t4.state = 'SENT'; ev(t4, '인계 기록 · ' + t4.qty + '개 · 사진 1장'); save(); toast('인계를 기록했습니다. 상대 기관이 인수 확인할 차례입니다'); render(); break;
      case 'receive': var t5 = deal(id), got = Math.max(0, +$('#rq').value || 0); if (got === t5.qty) { t5.state = 'RECEIVED'; ev(t5, '인수 확인 · ' + got + '개'); toast('받은 수량을 확인했습니다'); } else { t5.state = 'DISPUTED'; ev(t5, '수량 불일치 · 보냄 ' + t5.qty + ' / 받음 ' + got); toast('수량이 달라 진행을 멈췄습니다'); } save(); render(); break;
      case 'resolve': var t6 = deal(id); t6.state = 'RECEIVED'; ev(t6, '실제 전량 수령 확인'); save(); toast('정상 인수로 바꿨습니다'); render(); break;
      case 'done': if (!$('#ledger-ok').checked) { toast('에듀파인 처리 여부를 확인해 주세요'); break; } var t7 = deal(id); t7.state = 'DONE'; ev(t7, '대장 반영 확인'); save(); toast('완료했습니다'); render(); break;
      case 'submit-review': lot(id).state = 'REVIEW'; save(); toast('검토를 요청했습니다'); render(); break;
      case 'approve': if ($$('.rv').some(function (c) { return !c.checked; })) { toast('확인 항목 3가지를 모두 체크해 주세요'); break; } var L2 = lot(id); L2.state = 'PUBLISHED'; L2.verified = true; L2.days = 0; save(); toast('게시했습니다. 이제 다른 기관이 찾을 수 있습니다'); render(); break;
      case 'reject': lot(id).state = 'DRAFT'; save(); toast('작성자에게 수정을 요청했습니다'); render(); break;
      case 'pause': lot(id).state = 'PAUSED'; save(); toast('게시를 중단했습니다'); render(); break;
      case 'resume': lot(id).state = 'PUBLISHED'; save(); toast('다시 게시했습니다'); render(); break;
      case 'mtab': ui.mineTab = b.dataset.v; render(); break;
      case 'dtab': ui.dealTab = b.dataset.v; render(); break;
      case 'entry-ledger': ui.draft = newDraft('ledger'); ui.step = 0; break;
      case 'entry': readWizard(); ui.draft.entry = b.dataset.v; render(); break;
      case 'pick': ui.draft.ill = b.dataset.v; render(); break;
      case 'ai': readWizard(); ui.draft.title = '교실 빔프로젝터'; ui.draft.model = 'EB-X41'; ui.draft.cat = 'ELECTRONICS'; toast('AI 제안을 넣었습니다. 맞는지 확인해 주세요'); render(); break;
      case 'wstep': readWizard(); draftFromLedger(ui.draft); ui.step = +b.dataset.i; render(); break;
      case 'wnext': readWizard(); if (ui.step === 0 && ui.draft.entry !== 'photo' && !ui.draft.ledger.length) { toast('가져올 행을 하나 이상 골라 주세요'); break; } draftFromLedger(ui.draft); ui.step = Math.min(4, ui.step + 1); render(); window.scrollTo(0, 0); break;
      case 'wprev': readWizard(); ui.step = Math.max(0, ui.step - 1); render(); break;
      case 'save-draft': case 'finish':
        var d = ui.draft, groups = Object.keys(d.q).filter(function (k) { return d.q[k] > 0; }).map(function (k) { return { cond: k, qty: +d.q[k], avail: +d.q[k] }; });
        var nl = { id: 'L' + (++S.seq), title: d.title || '이름 없는 물품', cat: d.cat, org: myOrg(), ill: d.ill, state: a === 'finish' ? 'REVIEW' : 'DRAFT', days: 0, verified: false, maker: d.maker, model: d.model, desc: d.desc || '설명 없음', groups: groups.length ? groups : [{ cond: '양호', qty: 1, avail: 1 }], by: u.id };
        S.lots.unshift(nl); save(); ui.draft = null; ui.step = 0; ui.mineTab = nl.state; toast(a === 'finish' ? '검토를 요청했습니다' : '초안으로 저장했습니다'); go('#/lot/' + nl.id); break;
    }
  });
  function restore(t) { var l = lot(t.lot); l.groups.forEach(function (g) { if (g.cond === t.cond) g.avail += t.qty; }); }

  render();
})();

</script>
</body>
</html>
